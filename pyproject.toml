[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coda"
version = "0.0.1"
description = "Minimal CodeAct runtime with first-class observability."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "theohmwoa" }]
keywords = ["agent", "llm", "codeact", "anthropic", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/theohmwoa/coda"
Issues = "https://github.com/theohmwoa/coda/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/coda"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
